name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Require synchronized manifest hashes
        run: git diff --exit-code -- typeroll-extension.json
      - name: Build production container
        run: docker build --tag typeroll-extension-starter:test .
